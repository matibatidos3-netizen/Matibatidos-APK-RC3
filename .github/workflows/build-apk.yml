name: Build Matibatidos POS APK RC3

on:
  workflow_dispatch:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto Android RC3
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'Matibatidos_POS_APK_RC3_Project*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP de RC3."
            echo "Archivos encontrados:"
            ls -la
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          echo "Proyecto preparado:"
          find build-project/MatibatidosAPK -maxdepth 3 -type f | sort

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK RC3
        working-directory: build-project/MatibatidosAPK
        run: gradle :app:assembleDebug --stacktrace

      - name: Subir APK RC3
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK-RC3
          path: build-project/MatibatidosAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
